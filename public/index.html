<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do List</title>
    <link rel="stylesheet" href="./styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Metamorphous&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container py-3 mt-5 d-flex flex-row align-items-center">
        <img src="assets/dnd-cc-logo-black.png" alt="Dungeons and Dragons Character Creator Logo" width = "400vw">
        <header>
            <h1>Dungeons and Dragons Character Creator</h1>
        </header>
    </div>

    <div class="container text-center p-3 my-2 d-flex justify-content-center">
        <button type="button" class="btn btn-lg text-white" id="newItemButton"
        data-bs-toggle="modal" data-bs-target="#newItemModal">
        Create a New Character +
        </button>
    </div>

    <div class="modal fade h5" id="newItemModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title text-dark">New Character</h5>
        </div>
        
        <div class="modal-body">

            <div class="row mb-4">
                <div class="col">
                    <label for="charName" class="mb-2">Name</label>
                    <input type="text" id="charName" class="form-control"required>
                </div>
                <div class="col">
                    <label for="charSpecies" class="mb-2">Species</label>
                    <select class="form-select" id="charSpecies">
                    <option>Aasimar</option>
                    <option>Dragonborn</option>
                    <option>Dwarf</option>
                    <option>Elf</option>
                    <option>Gnome</option>
                    <option>Goliath</option>
                    <option>Halfling</option>
                    <option>Human</option>
                    <option>Orc</option>
                    <option>Tiefling</option>
                    </select>
                </div>
                <div class="col">
                    <label for="charClass" class="mb-2">Class</label>
                    <select class="form-select" id="charClass">
                    <option>Barbarian</option>
                    <option>Bard</option>
                    <option>Cleric</option>
                    <option>Druid</option>
                    <option>Fighter</option>
                    <option>Monk</option>
                    <option>Paladin</option>
                    <option>Ranger</option>
                    <option>Rogue</option>
                    <option>Sorcerer</option>
                    <option>Warlock</option>
                    <option>Wizard</option>
                    </select>
                </div>
            </div>
            <div class="row mb-4">
                <div class="col">
                    <label for="charLevel" class="mb-2">Level</label>
                    <input type="number" class="form-control" max="20" id="charLevel" required>
                </div>
                <div class="col">
                    <label for="charHp" class="mb-2">Hit Points</label>
                    <input type="number" class="form-control" id="charHp" required>
                </div>
                <div class="col">
                    <label for="charAc" class="mb-2">Armour Class</label>
                    <input type="number" class="form-control" id="charAc" required>
                </div>
            </div>


            <div class="row mb-4 text-center">
                <div class="col">
                    <label for="str" class="mb-2">Strength</label>
                    <input type="number" class="form-control" id="str" required>
                </div>
                <div class="col">
                    <label for="dex" class="mb-2">Dexterity</label>
                    <input type="number" class="form-control" id="dex" required>
                </div>
                <div class="col">
                    <label for="con" class="mb-2">Constitution</label>
                    <input type="number" class="form-control" id="con" required>
                </div>
                <div class="col">
                    <label for="int" class="mb-2">Intelligence</label>
                    <input type="number" class="form-control" class="form-control" id="int" required>
                </div>
                <div class="col">
                    <label for="wis" class="mb-2">Wisdom</label>
                    <input type="number" class="form-control" id="wis" required>
                </div>
                <div class="col">
                    <label for="cha" class="mb-2">Charisma</label>
                    <input type="number" class="form-control" id="cha" required>
                </div>
            </div>


            <div class="row mb-4">
                <div class="col">
                    <label for="inventory" class="mb-2">Inventory</label>
                    <textarea id="inventory" class="form-control"></textarea>
                </div>

                <div class="col">
                    <label for="notes" class="mb-2">Notes</label>
                    <textarea id="notes" class="form-control"></textarea>
                </div>
            </div>

            
        </div>

        <div class="modal-footer">
            <button type="button" id="saveButton" class="btn btn-primary" data-bs-dismiss="modal">
                Save
            </button>
            <button type="button" id="closeButton" class="btn btn-secondary" data-bs-dismiss="modal">
                Close
            </button>
        </div>
        </div>
    </div>
    </div>

    <div class="rounded h6 itemTable mx-auto my-5 col-11 col-md-6">
        <table class="table rounded">
        <tbody id="items">
            <!-- pre-filled row to test functionality -->
            <tr>
            <!-- <td><button class="done"></button></td>
            <td>Walk the dog</td>
            <td><button class="edit" data-bs-toggle="modal" data-bs-target="#newItemModal"></button></td>
            <td><button class="bin"></button></td> -->
            </tr>
        </tbody>
        </table>
    </div>

    <script src="./script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" 
    crossorigin="anonymous"></script>

</body>
</html>
